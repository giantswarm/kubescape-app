# Values for the kubescape operator app

# Flatcar ships runc at /opt/bin/runc, which is not in the node-agent's
# built-in runtime path list, so it must be set explicitly.
global:  # @schema additionalProperties: true
  overrideRuntimePath: /opt/bin/runc

exceptions:  # @schema additionalProperties: true
  enabled: true
  namespace: policy-exceptions

image:
  name: ""
  tag: ""

kubescape-operator:  # @schema skipProperties: true; additionalProperties: true
  additionalLabels:
    application.giantswarm.io/team: shield

  # Chart-wide default for every component that sets no tolerations of its own.
  # Giant Swarm arm64 node pools carry this taint; all kubescape images are
  # multi-arch, so every component may run there. A component-level
  # `tolerations` list replaces this one for that component.
  customScheduling:
    tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"

  capabilities:
    operator: enable
    configurationScan: enable
    continuousScan: enable
    nodeScan: enable

    vulnerabilityScan: enable
    scanEmbeddedSBOMs: disable
    relevancy: disable
    malwareDetection: enable

    runtimeObservability: enable
    networkPolicyService: enable
    runtimeDetection: enable
    nodeProfileService: enable
    seccompProfileService: enable
    nodeSbomGeneration: enable

    prometheusExporter: enable

  kubescape:
    # ephemeral-storage bounds the results/failed/artifact emptyDirs (require-emptydir-requests-and-limits).
    resources:
      requests:
        ephemeral-storage: 512Mi
      limits:
        ephemeral-storage: 4Gi
    serviceMonitor:
      enabled: true
    # Do not report the cluster to the Kubescape version check service.
    skipUpdateCheck: true
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape"
  # Runs the scan schedulers, the certgen init containers and the grype-offline-db rollout.
  kubescapeOpsTool:
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape-ops-tool"
  operator:
    # The operator calls kubevuln and kubescape by their bare Service names
    # (`kubevuln:8080`). On clusters where a Kyverno policy injects proxy env
    # vars into every pod, the injected NO_PROXY does not match those names, so
    # the calls go to the proxy and never arrive. The operator needs nothing
    # from the internet, so it opts out of the injection. See docs/proxy.md.
    podAnnotations:
      policies.kyverno.io/inject-proxy-env: exclude
    # The operator's only routine external call is a daily report to the
    # Kubescape version check service, which it cannot make without a proxy.
    # Upstream declares `env` as a map and ranges over its values, so this is
    # a map too; a list works but makes Helm warn on every render.
    env:
      skipUpdateCheck:
        name: KS_SKIP_UPDATE_CHECK
        value: "true"
    resources:
      requests:
        ephemeral-storage: 128Mi
      limits:
        ephemeral-storage: 1Gi
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape-operator"
  kubevuln:
    resources:
      limits:
        # The daily grype DB update keeps the old and the new DB (~3.2 GB each)
        # on disk side by side while the new one is indexed, which spikes usage
        # well above the steady state. The upstream 10Gi limit leaves too little
        # headroom and the pod gets evicted mid-update.
        ephemeral-storage: 20Gi
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape-kubevuln"
  storage:
    forceVirtualCrds: true
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape-storage"
  synchronizer:
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape-synchronizer"
  nodeAgent:
    # ephemeral-storage bounds the data and profiles emptyDirs
    # (require-emptydir-requests-and-limits). Only used while the autoscaler
    # below is off: the operator computes cpu and memory itself and its
    # DaemonSet template takes nothing else from this block.
    resources:
      requests:
        ephemeral-storage: 256Mi
      limits:
        ephemeral-storage: 2Gi
    # Off by default. When enabled, the operator, not Helm, owns the node-agent
    # DaemonSets: one `node-agent-<instance type>` per node instance type, sized
    # as a share of node allocatable. A Helm upgrade then no longer waits for
    # node-agent to roll out, and Flux no longer reports its failures.
    # Read docs/node-agent-autoscaler.md before enabling or disabling.
    autoscaler:
      enabled: false
      # Upstream defaults except the two limit percentages (upstream: 5 and 5).
      # Measured node-agent memory and CPU peaks do not shrink with node size,
      # so 5% of a small node is below what the agent uses.
      resourcePercentages:
        limitCPU: 15
        limitMemory: 25
    config:
      stdoutExporter: true
      maxLearningPeriod: 12h
      learningPeriod: 2m
      updatePeriod: 10m
      prometheusExporter: enable
    serviceMonitor:
      enabled: true
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape-node-agent"
    # The optional sbom-scanner sidecar runs the node-agent image with another entrypoint.
    sbomScanner:
      image:
        repository: "gsoci.azurecr.io/giantswarm/kubescape-node-agent"
  # Optional (off by default). Its image is amd64-only, so keep it off the arm64
  # nodes that customScheduling above lets every component onto.
  grypeOfflineDB:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
  prometheusExporter:
    enableWorkloadMetrics: true
    image:
      repository: "gsoci.azurecr.io/giantswarm/kubescape-prometheus-exporter"

podLogs:
  enabled: true
  tenant: giantswarm
  commonLabels: {}
  commonAnnotations: {}
  components:
    - name: grype-offline-db
      enabled: true
      # annotations: {}
      # labels: {}
      # relabelings: {}
      # tenant: ""
    - name: kubescape
      enabled: false
    - name: kubescape-scheduler
      enabled: true
    - name: kubevuln
      enabled: true
    - name: kubevuln-scheduler
      enabled: true
    - name: node-agent
      enabled: true
    - name: operator
      enabled: true
    - name: prometheus-exporter
      enabled: true
    - name: storage
      enabled: true
    - name: synchronizer
      enabled: true

# Vendored upstream subchart (charts/dependency_chart); declared so its coalesced
# defaults are accepted by the generated schema.
dependency_chart: {}  # @schema skipProperties: true; additionalProperties: true
