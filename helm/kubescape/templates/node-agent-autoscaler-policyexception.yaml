{{- /*
  In autoscaler mode the operator creates the node-agent DaemonSets from an
  upstream template that takes only cpu and memory for the container and no
  sizeLimit for the `data` and `profiles` emptyDirs, so the pods cannot satisfy
  require-emptydir-requests-and-limits. Remove this exception once the upstream
  chart lets us set either.

  A hook, like the exceptions in charts/exceptions, so that it exists before
  the upgrade lets the operator create the DaemonSets. Helm does not track
  hooks, so the exception stays behind when the autoscaler is turned off.
*/ -}}
{{- $autoscalerEnabled := dig "nodeAgent" "autoscaler" "enabled" false (index .Values "kubescape-operator") }}
{{- if and .Values.exceptions.enabled $autoscalerEnabled }}
apiVersion: policy.giantswarm.io/v1alpha1
kind: PolicyException
metadata:
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
  labels:
    policy.giantswarm.io/resource-kind: DaemonSet
    policy.giantswarm.io/resource-name: node-agent
    policy.giantswarm.io/resource-namespace: kubescape
  name: node-agent-daemonset-emptydir
  namespace: {{ .Values.exceptions.namespace }}
spec:
  policies:
    - require-emptydir-requests-and-limits
  targets:
    - kind: DaemonSet
      names:
        - node-agent-*
      namespaces:
        - kubescape
{{- end }}
